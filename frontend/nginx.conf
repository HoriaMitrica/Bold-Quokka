server {
  listen 80;
  server_name _;

  # Docker embedded DNS — resolve upstreams at request time so nginx
  # starts even when optional admin containers are not running yet.
  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  location /grafana/ {
    set $grafana_upstream grafana:3000;
    proxy_pass http://$grafana_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /pgadmin/ {
    set $pgadmin_upstream pgadmin:80;
    proxy_pass http://$pgadmin_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Script-Name /pgadmin;
  }

  location /prometheus/ {
    set $prometheus_upstream prometheus:9090;
    proxy_pass http://$prometheus_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /qdrant/ {
    rewrite ^/qdrant/(.*)$ /$1 break;
    set $qdrant_upstream qdrant:6333;
    proxy_pass http://$qdrant_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
